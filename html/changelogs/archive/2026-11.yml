    - rscadd: The rescue and jawed hook can snag and reel in mobs. The jawed hook
        also slows them down.
    - rscadd: Added the auto-reel fishing line, it speeds up fishing and lets you
        yank things towards you.
    - rscadd: Fishes love kronkaine.
    - rscadd: Examining a fishing spot twice with enough fishing skill (or the skillchip)
