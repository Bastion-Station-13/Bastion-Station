  JupiterJaeden:
  - rscadd: Adds new behavior to beepsky whenever the station is on green alert- instead
      of immediately stunning suspects, he will yell at them to turn themselves in
      and follow them around annoyingly while playing a siren noise. Beepsky will
      move faster than usual when doing this, but not quite as fast as regular movespeed.
      Suspects are counted as 'complying' when they are handcuffed, pulled by a security
      officer, inside the security department, or at the entrance to the brig. This
      behavior does not apply if either the target or beepsky himself is in a 'high-security'
      area such as the armory, where he will behave normally. He will also still retaliate
      as normal if attacked.
  - rscadd: When the station is on red alert, beepsky will stun and arrest people
      with search warrants as if they were arrest warrants.
  - balance: Sets lasers from 22 -> 24 damage (as opposed to 25 on current monke and
      /tg/).
  - balance: Sets hellfire lasers from 25 -> 30 damage.
  - balance: Reverts a previous (accidental) nerf to laser carbines, setting them
      back from 9 -> 10 dmg.
  - balance: Lowers e-gun lethal capacity from 16 -> 14.
  - balance: Increases e-gun disabler capacity, and hybrid taser disabler capacity,
      from 20 -> 25.
  - balance: Buffs nightmare by removing its 1.5x modifier to burn damage.
