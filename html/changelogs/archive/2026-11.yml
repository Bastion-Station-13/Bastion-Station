      slippery when lying down, crawl faster, resist grabs and dry out slower, but
      being dry makes you weaker.'
  - rscadd: Water adapted fish people get healed a bit by showers and drinking water.
  - rscadd: Squids, an ink producing fish you can catch in the ocean. Infusing one
